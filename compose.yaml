services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Copy .env.example to .env and set required values}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 12

  cache:
    image: memcached:1.6-alpine
    command: ["memcached", "-m", "64", "-I", "2m"]

  debug:
    image: busybox:1.37.0@sha256:bdf57e528e45e4433820e045b29b4597825a1c9e38353532d90a01445013f82e
    profiles: ["debug"]
    entrypoint: ["/bin/sh"]
    stdin_open: true
    tty: true
    depends_on:
      - api

  api:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        INSTALL_DEV_DEPENDENCIES: "true"
    platform: linux/amd64
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Set DJANGO_SECRET_KEY in .env}
      DJANGO_ENVIRONMENT: ${DJANGO_ENVIRONMENT:-development}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-true}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1}
      DJANGO_DB_ENGINE: django.db.backends.postgresql
      DJANGO_DB_NAME: ${POSTGRES_DB}
      DJANGO_DB_USER: ${POSTGRES_USER}
      DJANGO_DB_PASSWORD: ${POSTGRES_PASSWORD}
      DJANGO_DB_HOST: db
      DJANGO_DB_PORT: "5432"
      MEMCACHED_LOCATION: cache:11211
      CONTACT_EMAIL: ${CONTACT_EMAIL:-farmapp@localhost}
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_started

  ui:
    build:
      context: .
      dockerfile: docker/ui/Dockerfile
    ports:
      - "127.0.0.1:8000:80"
    depends_on:
      - api

volumes:
  postgres-data:
