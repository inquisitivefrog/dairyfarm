name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - ai-assisted
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Django tests and checks
    runs-on: ubuntu-latest
    env:
      DJANGO_SECRET_KEY: ci-only-not-a-production-secret
      DJANGO_ENVIRONMENT: development
      DJANGO_DEBUG: "true"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      POSTGRES_DB: dairyfarm
      POSTGRES_USER: dairyfarm
      POSTGRES_PASSWORD: ci-only-not-a-production-password

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Build API test image
        run: docker compose -p dairyfarm-ci build api

      - name: Run tests, Django checks, migrations, and SRE-tool lint
        run: |
          docker compose -p dairyfarm-ci run --rm api sh -c \
            "python manage.py test &&
             python manage.py check &&
             python manage.py makemigrations --check --dry-run &&
             python -m flake8 ../sre-tools"

  dependency-review:
    name: Review dependency changes
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check dependency changes for known vulnerabilities
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high

  secrets:
    name: Scan tracked source for secrets
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Scan working tree with Gitleaks
        run: |
          docker run --rm \
            -v "$PWD:/repo" \
            ghcr.io/gitleaks/gitleaks:v8.24.3@sha256:e1b35e12a8c6fa8901f060459cfb6b2fc4c484d3afbe3b029733a3bbfab07055 \
            detect --source=/repo --no-git --redact --exit-code 1
