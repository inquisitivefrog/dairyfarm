name: CI

on:
  pull_request:
  push:
    branches:
      - ai-assisted
      - master
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Django tests and checks
    runs-on: ubuntu-latest
    env:
      DJANGO_SECRET_KEY: ci-only-not-a-production-secret
      DJANGO_ENVIRONMENT: development
      DJANGO_DEBUG: "true"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      POSTGRES_DB: dairyfarm
      POSTGRES_USER: dairyfarm
      POSTGRES_PASSWORD: ci-only-not-a-production-password

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build API test image
        run: docker compose -p dairyfarm-ci build api

      - name: Run tests, Django checks, migrations, and SRE-tool lint
        run: |
          docker compose -p dairyfarm-ci run --rm api sh -c \
            "python manage.py test &&
             python manage.py check &&
             python manage.py makemigrations --check --dry-run &&
             python -m flake8 ../sre-tools"

  deploy-gcp:
    name: Deploy public demo to GCP
    if: >-
      github.ref == 'refs/heads/ai-assisted' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_REGION: us-central1
      IMAGE_TAG: production

    steps:
      - name: Check demo operating hours
        id: hours
        run: |
          hour="$(TZ=America/Los_Angeles date +%-H)"
          if [ "$hour" -ge 5 ] && [ "$hour" -lt 18 ]; then
            echo "open=true" >> "$GITHUB_OUTPUT"
          else
            echo "open=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Cloud SQL is stopped outside 5:00 a.m.-6:00 p.m. Pacific; deployment skipped. Re-run this workflow during operating hours."
          fi

      - name: Check out repository
        if: steps.hours.outputs.open == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Authenticate to Google Cloud with Workload Identity Federation
        if: steps.hours.outputs.open == 'true'
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        if: steps.hours.outputs.open == 'true'
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}

      - name: Build and push Cloud Run images
        if: steps.hours.outputs.open == 'true'
        env:
          REPOSITORY: ${{ vars.GCP_ARTIFACT_REGISTRY }}
        run: |
          gcloud auth configure-docker "${GCP_REGION}-docker.pkg.dev" --quiet
          docker build --platform linux/amd64 \
            -f Dockerfile \
            -t "${REPOSITORY}/api:${IMAGE_TAG}" .
          docker push "${REPOSITORY}/api:${IMAGE_TAG}"
          docker build --platform linux/amd64 \
            -f docker/ui/cloudrun.Dockerfile \
            -t "${REPOSITORY}/ui:${IMAGE_TAG}" .
          docker push "${REPOSITORY}/ui:${IMAGE_TAG}"

      - name: Deploy Cloud Run API, UI, and initialization job
        if: steps.hours.outputs.open == 'true'
        env:
          REPOSITORY: ${{ vars.GCP_ARTIFACT_REGISTRY }}
        run: |
          gcloud run jobs update dairyfarm-demo-initialize \
            --project "${GCP_PROJECT_ID}" \
            --region "${GCP_REGION}" \
            --image "${REPOSITORY}/api:${IMAGE_TAG}" \
            --quiet
          gcloud run jobs execute dairyfarm-demo-initialize \
            --project "${GCP_PROJECT_ID}" \
            --region "${GCP_REGION}" \
            --wait
          gcloud run services update dairyfarm-demo-api \
            --project "${GCP_PROJECT_ID}" \
            --region "${GCP_REGION}" \
            --image "${REPOSITORY}/api:${IMAGE_TAG}" \
            --quiet
          gcloud run services update dairyfarm-demo-ui \
            --project "${GCP_PROJECT_ID}" \
            --region "${GCP_REGION}" \
            --image "${REPOSITORY}/ui:${IMAGE_TAG}" \
            --quiet

      - name: Verify deployed revisions and public UI
        if: steps.hours.outputs.open == 'true'
        run: |
          for service in dairyfarm-demo-api dairyfarm-demo-ui; do
            ready="$(gcloud run services describe "$service" \
              --project "${GCP_PROJECT_ID}" \
              --region "${GCP_REGION}" \
              --format='value(status.conditions[0].status)')"
            test "$ready" = "True"
          done
          ui_url="$(gcloud run services describe dairyfarm-demo-ui \
            --project "${GCP_PROJECT_ID}" \
            --region "${GCP_REGION}" \
            --format='value(status.url)')"
          body="$(mktemp)"
          status="$(curl -sS -o "$body" -w '%{http_code}' "$ui_url/")"
          if [ "$status" = "200" ]; then
            grep -q 'data-public-demo="true"' "$body"
          elif [ "$status" = "503" ]; then
            grep -q 'DairyFarm demo is offline' "$body"
          else
            echo "Unexpected UI response: HTTP ${status}" >&2
            cat "$body" >&2
            exit 1
          fi
          rm -f "$body"

  dependency-review:
    name: Review dependency changes
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check dependency changes for known vulnerabilities
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high

  secrets:
    name: Scan tracked source for secrets
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Scan working tree with Gitleaks
        run: |
          docker run --rm \
            -v "$PWD:/repo" \
            ghcr.io/gitleaks/gitleaks:v8.24.3@sha256:e1b35e12a8c6fa8901f060459cfb6b2fc4c484d3afbe3b029733a3bbfab07055 \
            detect --source=/repo --no-git --redact --exit-code 1
